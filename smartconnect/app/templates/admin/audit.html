{% extends "base_app.html" %}
{% block content %}
<div class="card mb-3"><div class="card-body d-flex flex-wrap gap-2 align-items-end">
  <div><label class="form-label small mb-1" for="aAction">Action starts with</label>
    <input class="form-control" id="aAction" placeholder="e.g. auth. or visit."></div>
  <p class="small text-muted mb-0 ms-md-3">Passwords, QR tokens and access keys are never written to the audit log.</p>
</div></div>
<div class="card"><div class="table-wrap"><table class="table table-sm">
  <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th><th>IP</th></tr></thead>
  <tbody id="rows"></tbody></table></div>
  <div class="card-footer d-flex justify-content-between align-items-center">
    <span class="small text-muted" id="pageInfo"></span>
    <div class="btn-group btn-group-sm"><button class="btn btn-outline-primary" id="prevBtn">Previous</button>
      <button class="btn btn-outline-primary" id="nextBtn">Next</button></div></div></div>
{% endblock %}
{% block page_scripts %}<script src="{{ url_for('static', filename='js/admin_audit.js') }}"></script>{% endblock %}
