{% extends "base_app.html" %}
{% block content %}
<div class="card mb-3"><div class="card-body">
  <div class="row g-2 align-items-end">
    <div class="col-md-4"><label class="form-label small mb-1" for="fQ">Search</label>
      <input class="form-control" id="fQ" placeholder="Name, mobile or purpose"></div>
    <div class="col-6 col-md-2"><label class="form-label small mb-1" for="fStatus">Status</label>
      <select class="form-select" id="fStatus"><option value="">All</option>
        {% for s in ['PENDING','APPROVED','REJECTED','INSIDE','COMPLETED'] %}<option value="{{ s }}">{{ s.title() }}</option>{% endfor %}
      </select></div>
    <div class="col-6 col-md-2"><label class="form-label small mb-1" for="fDept">Department</label>
      <select class="form-select" id="fDept"><option value="">All</option></select></div>
    <div class="col-6 col-md-2"><label class="form-label small mb-1" for="fFrom">Expected from</label>
      <input class="form-control" type="date" id="fFrom"></div>
    <div class="col-6 col-md-2"><label class="form-label small mb-1" for="fTo">Expected to</label>
      <input class="form-control" type="date" id="fTo"></div>
  </div>
</div></div>

<div class="card">
  <div class="table-wrap"><table class="table table-hover">
    <thead><tr><th>Visitor</th><th>Mobile</th><th>Host</th><th>Department</th><th>Expected</th><th>Status</th><th>Last gate</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="text-center text-muted">Loading…</td></tr></tbody>
  </table></div>
  <div class="card-footer d-flex justify-content-between align-items-center">
    <span class="small text-muted" id="pageInfo"></span>
    <div class="btn-group btn-group-sm">
      <button class="btn btn-outline-primary" id="prevBtn">Previous</button>
      <button class="btn btn-outline-primary" id="nextBtn">Next</button>
    </div>
  </div>
</div>

<div class="modal fade" id="visitorModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="mTitle">Visitor</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-footer" id="mFoot"></div>
  </div></div>
</div>
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='js/visitors_list.js') }}"></script>
{% endblock %}
