{% extends "base_public.html" %}
{% block content %}
<div class="container my-4" style="max-width:820px">
  <div class="card">
    <div class="card-body p-4">
      <h2 class="h4">Visitor registration</h2>
      <p class="text-muted">Fill in your details. You will receive a QR pass instantly. Your host must approve the
        visit before the pass can be used at the gate.</p>
      <form id="regForm" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="full_name">Full name</label>
            <input class="form-control" id="full_name" maxlength="100" autocomplete="name" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="mobile">Mobile number</label>
            <input class="form-control" id="mobile" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="9876543210" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" maxlength="120" autocomplete="email" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="expected_at">Expected visit date &amp; time</label>
            <input class="form-control" id="expected_at" type="datetime-local" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="address">Address</label>
            <input class="form-control" id="address" maxlength="255" autocomplete="street-address" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="purpose">Purpose of visit</label>
            <input class="form-control" id="purpose" maxlength="255" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="department_id">Department</label>
            <select class="form-select" id="department_id" required><option value="">Loading…</option></select>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="host_id">Host employee</label>
            <select class="form-select" id="host_id" required><option value="">Choose a department first</option></select>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="alert alert-danger mt-3 d-none" id="regError" role="alert"></div>
        <button class="btn btn-primary mt-3" id="regBtn" type="submit">Register &amp; get QR pass</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/register.js') }}"></script>{% endblock %}
